[package]
name = "clearsky-note"
version = "0.1.0"
description = "Offline-first note app with multi-level folders and WebDAV sync."
authors = ["Codex"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "clearsky_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-http = "2.0.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

